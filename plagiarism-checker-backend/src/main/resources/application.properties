server.port=8080

# Spring MVC Multipart Upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# H2 Database Configuration (File-based so history persists)
spring.datasource.url=jdbc:h2:file:./data/plagiarismdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Gemini AI API Configuration (Optional: can also be passed from request or environment)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
